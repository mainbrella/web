<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1113" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Explore a BFF message board with passwordless demo sessions." />
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      * { box-sizing: border-box; }
      html { min-width: 320px; background: #0e1113; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0e1113;
        color: #edf4fc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .page-footer {
        display: flex;
        max-width: 800px;
        min-height: 56px;
        align-items: center;
        justify-content: space-between;
        margin: 0 auto;
        padding: 0 0 14px;
        color: #a3b3c7;
        font-size: 12px;
      }
      @media (max-width: 600px) {
        .page-footer { width: calc(100% - 32px); }
      }
    </style>
    <link rel="icon" href="https://mainbrella.com/images/favicon.png" type="image/png" />
    <title>Message board · BFF</title>
  </head>
  <body>
    <div id="message-board-root"></div>
    <footer class="page-footer">
      <span>© Mainbrella</span>
    </footer>
    <noscript><p class="noscript">Enable JavaScript to load messages from the live board.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
