<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="title desc"><title id="title">Reconnect to the same job</title><desc id="desc">Job J runs continuously while the client loses its output stream. Event 2 is retained during the gap. The client reconnects with cursor 1 and receives event 2 and completion without starting J again.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#275f85"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6948"/></marker></defs><rect width="920" height="470" fill="#f7f4ec"/><g font-family="Helvetica,Arial,sans-serif"><text x="28" y="36" font-size="25" fill="#263238" font-weight="600" text-anchor="start">A new stream. The same job.</text><text x="168" y="82" font-size="22" fill="#263238" font-weight="600" text-anchor="middle">Client</text><text x="759" y="82" font-size="22" fill="#263238" font-weight="600" text-anchor="middle">Job J</text><path d="M168 104L168 426" fill="none" stroke="#9ba7ac" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="704" y="111" width="110" height="315" rx="5" fill="#e4eff4" stroke="#275f85" stroke-width="2"/><text x="759" y="146" font-size="19" fill="#275f85" font-weight="500" text-anchor="middle">running</text><path d="M168 112L704 112" fill="none" stroke="#275f85" stroke-width="2.5" marker-end="url(#blue)"/><text x="332" y="101" font-size="21" fill="#275f85" font-weight="600" text-anchor="start">Start J once</text><path d="M704 180L168 180" fill="none" stroke="#275f85" stroke-width="2.5" marker-end="url(#blue)"/><text x="332" y="165" font-size="21" fill="#275f85" font-weight="400" text-anchor="start">Output event 1</text><rect x="80" y="213" width="176" height="68" fill="#f6e8e2" stroke="#9b3933" stroke-width="1.5"/><text x="168" y="240" font-size="20" fill="#9b3933" font-weight="600" text-anchor="middle">Stream drops</text><text x="168" y="265" font-size="18" fill="#9b3933" font-weight="400" text-anchor="middle">No connection</text><circle cx="759" cy="246" r="7" fill="#275f85"/><text x="410" y="240" font-size="21" fill="#275f85" font-weight="600" text-anchor="start">Event 2 saved</text><text x="410" y="265" font-size="18" fill="#53616a" font-weight="400" text-anchor="start">while the client is away</text><path d="M168 314L704 314" fill="none" stroke="#2a6948" stroke-width="2.5" marker-end="url(#green)"/><text x="332" y="301" font-size="21" fill="#2a6948" font-weight="600" text-anchor="start">Resume with cursor 1</text><path d="M704 370L168 370" fill="none" stroke="#275f85" stroke-width="2.5" marker-end="url(#blue)"/><text x="332" y="356" font-size="21" fill="#275f85" font-weight="400" text-anchor="start">Output event 2</text><path d="M704 423L168 423" fill="none" stroke="#2a6948" stroke-width="2.5" marker-end="url(#green)"/><text x="332" y="410" font-size="21" fill="#2a6948" font-weight="400" text-anchor="start">Completion</text><text x="28" y="455" font-size="18" fill="#53616a" font-weight="400" text-anchor="start">Time ↓</text></g></svg>