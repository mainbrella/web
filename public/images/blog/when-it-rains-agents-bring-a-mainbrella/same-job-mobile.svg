<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650" role="img" aria-labelledby="title desc"><title id="title">Reconnect to the same job</title><desc id="desc">Job J runs continuously while the client loses its output stream. Event 2 is retained during the gap. The client reconnects with cursor 1 and receives event 2 and completion without starting J again.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#275f85"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6948"/></marker></defs><rect width="440" height="650" fill="#f7f4ec"/><g font-family="Helvetica,Arial,sans-serif"><text x="22" y="34" font-size="24" fill="#263238" font-weight="600" text-anchor="start">One job. Two output streams.</text><text x="82" y="92" font-size="21" fill="#263238" font-weight="600" text-anchor="middle">Client</text><text x="350" y="92" font-size="21" fill="#263238" font-weight="600" text-anchor="middle">Job J</text><path d="M82 119L82 597" fill="none" stroke="#9ba7ac" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="321" y="145" width="58" height="452" rx="5" fill="#e4eff4" stroke="#275f85" stroke-width="2"/><path d="M82 146L321 146" fill="none" stroke="#275f85" stroke-width="2.5" marker-end="url(#blue)"/><text x="122" y="131" font-size="21" fill="#275f85" font-weight="600" text-anchor="start">Start J once</text><path d="M321 216L82 216" fill="none" stroke="#275f85" stroke-width="2.5" marker-end="url(#blue)"/><text x="122" y="201" font-size="20" fill="#275f85" font-weight="400" text-anchor="start">Output event 1</text><rect x="22" y="269" width="135" height="70" fill="#f6e8e2" stroke="#9b3933" stroke-width="1.5"/><text x="89" y="297" font-size="18" fill="#9b3933" font-weight="600" text-anchor="middle">Stream drops</text><text x="89" y="322" font-size="17" fill="#9b3933" font-weight="400" text-anchor="middle">Disconnected</text><circle cx="350" cy="306" r="7" fill="#275f85"/><text x="187" y="295" font-size="20" fill="#275f85" font-weight="600" text-anchor="start">Event 2</text><text x="187" y="321" font-size="19" fill="#275f85" font-weight="400" text-anchor="start">saved here</text><text x="187" y="354" font-size="18" fill="#53616a" font-weight="400" text-anchor="start">J keeps running</text><path d="M82 416L321 416" fill="none" stroke="#2a6948" stroke-width="2.5" marker-end="url(#green)"/><text x="122" y="378" font-size="20" fill="#2a6948" font-weight="600" text-anchor="start">Resume</text><text x="122" y="403" font-size="20" fill="#2a6948" font-weight="400" text-anchor="start">with cursor 1</text><path d="M321 496L82 496" fill="none" stroke="#275f85" stroke-width="2.5" marker-end="url(#blue)"/><text x="122" y="481" font-size="20" fill="#275f85" font-weight="400" text-anchor="start">Output event 2</text><path d="M321 594L82 594" fill="none" stroke="#2a6948" stroke-width="2.5" marker-end="url(#green)"/><text x="122" y="577" font-size="20" fill="#2a6948" font-weight="400" text-anchor="start">Completion</text><text x="22" y="632" font-size="18" fill="#53616a" font-weight="400" text-anchor="start">Time ↓</text></g></svg>