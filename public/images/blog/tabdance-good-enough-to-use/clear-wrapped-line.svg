<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410"><title>Command-K keeps the entire wrapped command</title><rect x="0" y="0" width="880" height="410" rx="3" fill="#f7f4ec" stroke="none" /><text x="28" y="45" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">Before Command-K</text><rect x="28" y="67" width="356" height="43" rx="3" fill="#f1dfd8" stroke="none" /><text x="40" y="94" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" >older scrollback</text><rect x="28" y="126" width="356" height="166" rx="3" fill="#fff" stroke="#b5bcb7" /><rect x="59" y="132" width="317" height="36" rx="3" fill="#f6e8e3" stroke="none" /><text x="38" y="157" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >0</text><text x="70" y="157" fill="#263238" font-family="Menlo, Consolas, monospace" font-size="17" >build: finished</text><rect x="59" y="172" width="317" height="36" rx="3" fill="#e4f0e8" stroke="none" /><text x="38" y="197" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >1</text><text x="70" y="197" fill="#185d3b" font-family="Menlo, Consolas, monospace" font-size="17" >$ printf &#x27;%s\n&#x27; alph</text><rect x="59" y="212" width="317" height="36" rx="3" fill="#e4f0e8" stroke="none" /><text x="38" y="237" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >2</text><text x="70" y="237" fill="#185d3b" font-family="Menlo, Consolas, monospace" font-size="17" >a beta gamma</text><text x="38" y="277" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >3</text><text x="70" y="277" fill="#263238" font-family="Menlo, Consolas, monospace" font-size="17" ></text><path d="M121.0 215v29" stroke="#175c91" stroke-width="2.5"/><path d="M391 178h8v60h-8" fill="none" stroke="#185d3b" stroke-width="2"/><text x="28" y="322" fill="#185d3b" font-family="Arial, Helvetica, sans-serif" font-size="16" >two rows · one logical line</text><text x="494" y="45" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">After Command-K</text><rect x="494" y="67" width="356" height="43" rx="3" fill="#e7ecea" stroke="none" /><text x="506" y="94" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" >scrollback empty</text><rect x="494" y="126" width="356" height="166" rx="3" fill="#fff" stroke="#b5bcb7" /><rect x="525" y="132" width="317" height="36" rx="3" fill="#e4f0e8" stroke="none" /><text x="504" y="157" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >0</text><text x="536" y="157" fill="#185d3b" font-family="Menlo, Consolas, monospace" font-size="17" >$ printf &#x27;%s\n&#x27; alph</text><rect x="525" y="172" width="317" height="36" rx="3" fill="#e4f0e8" stroke="none" /><text x="504" y="197" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >1</text><text x="536" y="197" fill="#185d3b" font-family="Menlo, Consolas, monospace" font-size="17" >a beta gamma</text><text x="504" y="237" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >2</text><text x="536" y="237" fill="#263238" font-family="Menlo, Consolas, monospace" font-size="17" ></text><text x="504" y="277" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >3</text><text x="536" y="277" fill="#263238" font-family="Menlo, Consolas, monospace" font-size="17" ></text><path d="M587.0 175v29" stroke="#175c91" stroke-width="2.5"/><path d="M857 138h8v60h-8" fill="none" stroke="#185d3b" stroke-width="2"/><text x="494" y="322" fill="#185d3b" font-family="Arial, Helvetica, sans-serif" font-size="16" >same command · same cursor column</text><path d="M410 196h49m-8-7 8 7-8 7" fill="none" stroke="#175c91" stroke-width="2"/><text x="28" y="376" fill="#175c91" font-family="Arial, Helvetica, sans-serif" font-size="17" >The emulator changes its buffer. No Control-L goes to the shell.</text></svg>
