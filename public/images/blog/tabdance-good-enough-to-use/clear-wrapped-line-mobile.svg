<svg xmlns="http://www.w3.org/2000/svg" width="390" height="686" viewBox="0 0 390 686"><title>Command-K keeps the entire wrapped command</title><rect x="0" y="0" width="390" height="686" rx="3" fill="#f7f4ec" stroke="none" /><text x="20" y="35" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">Before Command-K</text><rect x="20" y="57" width="332" height="43" rx="3" fill="#f1dfd8" stroke="none" /><text x="32" y="84" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" >older scrollback</text><rect x="20" y="116" width="332" height="166" rx="3" fill="#fff" stroke="#b5bcb7" /><rect x="51" y="122" width="293" height="36" rx="3" fill="#f6e8e3" stroke="none" /><text x="30" y="147" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >0</text><text x="62" y="147" fill="#263238" font-family="Menlo, Consolas, monospace" font-size="17" >build: finished</text><rect x="51" y="162" width="293" height="36" rx="3" fill="#e4f0e8" stroke="none" /><text x="30" y="187" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >1</text><text x="62" y="187" fill="#185d3b" font-family="Menlo, Consolas, monospace" font-size="17" >$ printf &#x27;%s\n&#x27; alph</text><rect x="51" y="202" width="293" height="36" rx="3" fill="#e4f0e8" stroke="none" /><text x="30" y="227" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >2</text><text x="62" y="227" fill="#185d3b" font-family="Menlo, Consolas, monospace" font-size="17" >a beta gamma</text><text x="30" y="267" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >3</text><text x="62" y="267" fill="#263238" font-family="Menlo, Consolas, monospace" font-size="17" ></text><path d="M113.0 205v29" stroke="#175c91" stroke-width="2.5"/><path d="M359 168h8v60h-8" fill="none" stroke="#185d3b" stroke-width="2"/><text x="20" y="312" fill="#185d3b" font-family="Arial, Helvetica, sans-serif" font-size="16" >two rows · one logical line</text><text x="20" y="340" fill="#175c91" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">Move the wrapped line together</text><text x="20" y="382" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">After Command-K</text><rect x="20" y="404" width="332" height="43" rx="3" fill="#e7ecea" stroke="none" /><text x="32" y="431" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" >scrollback empty</text><rect x="20" y="463" width="332" height="166" rx="3" fill="#fff" stroke="#b5bcb7" /><rect x="51" y="469" width="293" height="36" rx="3" fill="#e4f0e8" stroke="none" /><text x="30" y="494" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >0</text><text x="62" y="494" fill="#185d3b" font-family="Menlo, Consolas, monospace" font-size="17" >$ printf &#x27;%s\n&#x27; alph</text><rect x="51" y="509" width="293" height="36" rx="3" fill="#e4f0e8" stroke="none" /><text x="30" y="534" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >1</text><text x="62" y="534" fill="#185d3b" font-family="Menlo, Consolas, monospace" font-size="17" >a beta gamma</text><text x="30" y="574" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >2</text><text x="62" y="574" fill="#263238" font-family="Menlo, Consolas, monospace" font-size="17" ></text><text x="30" y="614" fill="#59666a" font-family="Menlo, Consolas, monospace" font-size="14" >3</text><text x="62" y="614" fill="#263238" font-family="Menlo, Consolas, monospace" font-size="17" ></text><path d="M113.0 512v29" stroke="#175c91" stroke-width="2.5"/><path d="M359 475h8v60h-8" fill="none" stroke="#185d3b" stroke-width="2"/><text x="20" y="659" fill="#185d3b" font-family="Arial, Helvetica, sans-serif" font-size="16" >same command · same cursor column</text></svg>
