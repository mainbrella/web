<svg xmlns="http://www.w3.org/2000/svg" width="440" height="400" viewBox="0 0 440 400" role="img" aria-labelledby="title desc"><title id="title">One machine, two preview grants</title><desc id="desc">One guest server runs while preview A expires and preview B is issued. Reconnection resolves the changed target. Preview renewal does not extend the machine hard deadline; an idle deadline may end the server sooner.</desc><defs><marker id="53616a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53616a"/></marker><marker id="275f85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#275f85"/></marker><marker id="2a6948" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6948"/></marker><marker id="9b3933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9b3933"/></marker></defs><rect width="440" height="400" fill="#f7f4ec"/><g font-family="Helvetica,Arial,sans-serif"><text x="20" y="33" fill="#263238" font-size="22" font-weight="600" text-anchor="start">Same server, renewed address</text><text x="20" y="83" fill="#2a6948" font-size="20" font-weight="600" text-anchor="start">Guest server</text><path d="M28 108L384 108" fill="none" stroke="#2a6948" stroke-width="7"/><text x="20" y="155" fill="#275f85" font-size="20" font-weight="600" text-anchor="start">Preview access</text><path d="M28 185L174 185" fill="none" stroke="#275f85" stroke-width="7"/><text x="40" y="175" fill="#275f85" font-size="20" font-weight="600" text-anchor="start">A</text><path d="M209 185L384 185" fill="none" stroke="#275f85" stroke-width="7"/><text x="225" y="175" fill="#275f85" font-size="20" font-weight="600" text-anchor="start">B</text><path d="M174 184L174 259" fill="none" stroke="#53616a" stroke-width="2" stroke-dasharray="6 5"/><circle cx="174" cy="185" r="5" fill="#9b3933"/><path d="M182 232L229 199" fill="none" stroke="#275f85" stroke-width="2" marker-end="url(#275f85)"/><text x="20" y="281" fill="#263238" font-size="19" font-weight="400" text-anchor="start">A expires → resolve target again</text><text x="20" y="309" fill="#263238" font-size="19" font-weight="400" text-anchor="start">Reconnect uses B; files stay put.</text><path d="M384 66L384 231" fill="none" stroke="#9b3933" stroke-width="2" stroke-dasharray="6 5"/><text x="246" y="244" fill="#9b3933" font-size="19" font-weight="600" text-anchor="start">Hard deadline</text><text x="20" y="364" fill="#53616a" font-size="18" font-weight="400" text-anchor="start">Renewing B cannot move the deadline.</text></g></svg>