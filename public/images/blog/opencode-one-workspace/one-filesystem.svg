<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title desc"><title id="title">Which checkout does each tool touch?</title><desc id="desc">The hypothetical shell-only placement reads and edits the host checkout but tests a separate guest checkout. The PR instead places the OpenCode server and all three tools beside one guest checkout.</desc><defs><marker id="53616a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53616a"/></marker><marker id="275f85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#275f85"/></marker><marker id="2a6948" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6948"/></marker><marker id="9b3933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9b3933"/></marker></defs><rect width="880" height="500" fill="#f7f4ec"/><g font-family="Helvetica,Arial,sans-serif"><text x="24" y="34" fill="#9b3933" font-size="24" font-weight="600" text-anchor="start">Move only bash (hypothetical)</text><rect x="24" y="55" width="392" height="167" rx="4" fill="#f1e4df" stroke="#9b3933" stroke-width="2"/><rect x="456" y="55" width="400" height="167" rx="4" fill="#edf0f1" stroke="#53616a" stroke-width="2"/><text x="42" y="85" fill="#263238" font-size="22" font-weight="600" text-anchor="start">Laptop</text><text x="474" y="85" fill="#263238" font-size="22" font-weight="600" text-anchor="start">Guest</text><text x="50" y="145" fill="#9b3933" font-size="22" font-weight="400" text-anchor="start">read · edit</text><path d="M169 139L252 139" fill="none" stroke="#9b3933" stroke-width="2" marker-end="url(#9b3933)"/><path d="M270 106h75l18 18v64h-93z M345 106v18h18" fill="#fffdf7" stroke="#9b3933" stroke-width="2"/><text x="280" y="145" fill="#9b3933" font-size="18" font-weight="600" text-anchor="start">parser.ts</text><text x="280" y="170" fill="#9b3933" font-size="16" font-weight="400" text-anchor="start">edited</text><text x="483" y="145" fill="#263238" font-size="22" font-weight="400" text-anchor="start">bash / test</text><path d="M610 139L690 139" fill="none" stroke="#53616a" stroke-width="2" marker-end="url(#53616a)"/><path d="M710 106h75l18 18v64h-93z M785 106v18h18" fill="#fffdf7" stroke="#53616a" stroke-width="2"/><text x="720" y="145" fill="#53616a" font-size="18" font-weight="600" text-anchor="start">parser.ts</text><text x="720" y="170" fill="#53616a" font-size="16" font-weight="400" text-anchor="start">unchanged</text><text x="24" y="263" fill="#2a6948" font-size="24" font-weight="600" text-anchor="start">Move the server (our PR)</text><rect x="24" y="285" width="290" height="169" rx="4" fill="#edf0f1" stroke="#53616a" stroke-width="2"/><rect x="354" y="285" width="502" height="169" rx="4" fill="#e4efe7" stroke="#2a6948" stroke-width="2"/><text x="42" y="315" fill="#263238" font-size="22" font-weight="600" text-anchor="start">Laptop</text><text x="372" y="315" fill="#263238" font-size="22" font-weight="600" text-anchor="start">Guest</text><text x="55" y="379" fill="#275f85" font-size="22" font-weight="400" text-anchor="start">Interface</text><path d="M165 371L392 371" fill="none" stroke="#275f85" stroke-width="2" marker-end="url(#275f85)"/><rect x="409" y="336" width="225" height="87" rx="4" fill="#fffdf7" stroke="#2a6948" stroke-width="2"/><text x="424" y="370" fill="#2a6948" font-size="22" font-weight="600" text-anchor="start">OpenCode server</text><text x="424" y="401" fill="#2a6948" font-size="21" font-weight="400" text-anchor="start">read · edit · test</text><path d="M641 376L690 376" fill="none" stroke="#2a6948" stroke-width="2" marker-end="url(#2a6948)"/><path d="M710 337h75l18 18v64h-93z M785 337v18h18" fill="#fffdf7" stroke="#2a6948" stroke-width="2"/><text x="720" y="376" fill="#2a6948" font-size="18" font-weight="600" text-anchor="start">parser.ts</text><text x="720" y="401" fill="#2a6948" font-size="16" font-weight="400" text-anchor="start">edited</text><text x="24" y="485" fill="#2a6948" font-size="20" font-weight="400" text-anchor="start">All three tools see the same checkout.</text></g></svg>