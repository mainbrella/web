<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title desc"><title id="title">One machine, two preview grants</title><desc id="desc">One guest server runs while preview A expires and preview B is issued. Reconnection resolves the changed target. Preview renewal does not extend the machine hard deadline; an idle deadline may end the server sooner.</desc><defs><marker id="53616a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53616a"/></marker><marker id="275f85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#275f85"/></marker><marker id="2a6948" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6948"/></marker><marker id="9b3933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9b3933"/></marker></defs><rect width="880" height="330" fill="#f7f4ec"/><g font-family="Helvetica,Arial,sans-serif"><text x="24" y="34" fill="#263238" font-size="25" font-weight="600" text-anchor="start">Same server, renewed address</text><text x="24" y="99" fill="#2a6948" font-size="21" font-weight="600" text-anchor="start">Guest server</text><path d="M215 92L806 92" fill="none" stroke="#2a6948" stroke-width="8"/><text x="24" y="170" fill="#275f85" font-size="21" font-weight="600" text-anchor="start">Preview access</text><path d="M215 163L453 163" fill="none" stroke="#275f85" stroke-width="8"/><text x="250" y="147" fill="#275f85" font-size="21" font-weight="600" text-anchor="start">A</text><path d="M491 163L806 163" fill="none" stroke="#275f85" stroke-width="8"/><text x="526" y="147" fill="#275f85" font-size="21" font-weight="600" text-anchor="start">B</text><path d="M453 112L453 247" fill="none" stroke="#53616a" stroke-width="2" stroke-dasharray="6 5"/><circle cx="453" cy="163" r="5" fill="#9b3933"/><text x="240" y="226" fill="#9b3933" font-size="20" font-weight="400" text-anchor="start">A expires</text><path d="M464 220L520 179" fill="none" stroke="#275f85" stroke-width="2" marker-end="url(#275f85)"/><text x="526" y="226" fill="#275f85" font-size="20" font-weight="600" text-anchor="start">Resolve target again</text><text x="526" y="255" fill="#275f85" font-size="20" font-weight="400" text-anchor="start">Reconnect through B</text><path d="M806 57L806 270" fill="none" stroke="#9b3933" stroke-width="2" stroke-dasharray="6 5"/><text x="791" y="296" fill="#9b3933" font-size="20" font-weight="600" text-anchor="end">Hard deadline</text><text x="24" y="310" fill="#53616a" font-size="19" font-weight="400" text-anchor="start">Renewing access leaves the machine’s deadline where it was.</text></g></svg>