<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660" role="img" aria-labelledby="title desc"><title id="title">Which checkout does each tool touch?</title><desc id="desc">The hypothetical shell-only placement reads and edits the host checkout but tests a separate guest checkout. The PR instead places the OpenCode server and all three tools beside one guest checkout.</desc><defs><marker id="53616a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53616a"/></marker><marker id="275f85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#275f85"/></marker><marker id="2a6948" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6948"/></marker><marker id="9b3933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9b3933"/></marker></defs><rect width="440" height="660" fill="#f7f4ec"/><g font-family="Helvetica,Arial,sans-serif"><text x="20" y="33" fill="#9b3933" font-size="21" font-weight="600" text-anchor="start">Move only bash (hypothetical)</text><rect x="20" y="52" width="185" height="220" rx="4" fill="#f1e4df" stroke="#9b3933" stroke-width="2"/><rect x="225" y="52" width="195" height="220" rx="4" fill="#edf0f1" stroke="#53616a" stroke-width="2"/><text x="35" y="82" fill="#263238" font-size="21" font-weight="600" text-anchor="start">Laptop</text><text x="240" y="82" fill="#263238" font-size="21" font-weight="600" text-anchor="start">Guest</text><text x="35" y="121" fill="#9b3933" font-size="20" font-weight="400" text-anchor="start">read · edit</text><text x="240" y="121" fill="#263238" font-size="20" font-weight="400" text-anchor="start">bash / test</text><path d="M85 136L85 161" fill="none" stroke="#9b3933" stroke-width="2" marker-end="url(#9b3933)"/><path d="M290 136L290 161" fill="none" stroke="#53616a" stroke-width="2" marker-end="url(#53616a)"/><path d="M40 171h75l18 18v64h-93z M115 171v18h18" fill="#fffdf7" stroke="#9b3933" stroke-width="2"/><text x="50" y="210" fill="#9b3933" font-size="18" font-weight="600" text-anchor="start">parser.ts</text><text x="50" y="235" fill="#9b3933" font-size="16" font-weight="400" text-anchor="start">edited</text><path d="M245 171h75l18 18v64h-93z M320 171v18h18" fill="#fffdf7" stroke="#53616a" stroke-width="2"/><text x="255" y="210" fill="#53616a" font-size="18" font-weight="600" text-anchor="start">parser.ts</text><text x="255" y="235" fill="#53616a" font-size="16" font-weight="400" text-anchor="start">unchanged</text><text x="20" y="306" fill="#2a6948" font-size="21" font-weight="600" text-anchor="start">Move the server (our PR)</text><rect x="20" y="326" width="130" height="288" rx="4" fill="#edf0f1" stroke="#53616a" stroke-width="2"/><rect x="170" y="326" width="250" height="288" rx="4" fill="#e4efe7" stroke="#2a6948" stroke-width="2"/><text x="35" y="356" fill="#263238" font-size="21" font-weight="600" text-anchor="start">Laptop</text><text x="185" y="356" fill="#263238" font-size="21" font-weight="600" text-anchor="start">Guest</text><text x="35" y="403" fill="#275f85" font-size="19" font-weight="400" text-anchor="start">Interface</text><path d="M119 410L191 410" fill="none" stroke="#275f85" stroke-width="2" marker-end="url(#275f85)"/><rect x="199" y="383" width="201" height="83" rx="4" fill="#fffdf7" stroke="#2a6948" stroke-width="2"/><text x="212" y="415" fill="#2a6948" font-size="19" font-weight="600" text-anchor="start">OpenCode server</text><text x="212" y="444" fill="#2a6948" font-size="19" font-weight="400" text-anchor="start">read · edit · test</text><path d="M292 470L292 497" fill="none" stroke="#2a6948" stroke-width="2" marker-end="url(#2a6948)"/><path d="M246 507h75l18 18v64h-93z M321 507v18h18" fill="#fffdf7" stroke="#2a6948" stroke-width="2"/><text x="256" y="546" fill="#2a6