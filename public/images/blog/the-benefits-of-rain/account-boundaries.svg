<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">Account records outlive Linux compute</title><desc id="desc">The API routes to separate account coordinators. Each account shares usage across two workspace controllers. One Linux machine is stopped; its controller and shared usage record remain.</desc><rect width="920" height="480" fill="#f7f4ec"/><g font-family="Helvetica,Arial,sans-serif"><text x="26" y="32" font-size="22" fill="#263238" font-weight="600" text-anchor="start">Two customers, separate budgets</text><rect x="349" y="53" width="222" height="48" rx="5" fill="#ffffff" stroke="#275f85" stroke-width="1.5"/><text x="460" y="83" font-size="20" fill="#275f85" font-weight="600" text-anchor="middle">API Worker</text><text x="26" y="84" font-size="16" fill="#53616a" font-weight="400" text-anchor="start">Sessions + API keys</text><text x="722" y="84" font-size="16" fill="#53616a" font-weight="400" text-anchor="start">Account / billing in D1</text><rect x="26" y="142" width="426" height="312" rx="8" fill="#efede6" stroke="#a8b2b6" stroke-width="1.5"/><text x="44" y="172" font-size="20" fill="#263238" font-weight="600" text-anchor="start">Customer A</text><rect x="135.0" y="200" width="208" height="67" rx="5" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/><text x="159.0" y="225" font-size="17" fill="#275f85" font-weight="600" text-anchor="start">Account coordinator</text><path d="M147.0 238v17c0 8 26 8 26 0V238" fill="#cce0e9" stroke="#275f85" stroke-width="1.5"/><ellipse cx="160.0" cy="238" rx="13" ry="4" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/><text x="181.0" y="256" font-size="15" fill="#275f85" font-weight="400" text-anchor="start">Shared usage</text><path d="M239.0 267v21M164.0 288h150M164.0 288v17M314.0 288v17" fill="none" stroke="#275f85" stroke-width="2"/><rect x="112.0" y="305" width="104" height="34" rx="5" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/><text x="164.0" y="328" font-size="17" fill="#275f85" font-weight="600" text-anchor="middle">Controller</text><path d="M164.0 339v23" fill="none" stroke="#275f85" stroke-width="2"/><rect x="118.0" y="362" width="92" height="52" rx="5" fill="#ffffff" stroke="#275f85" stroke-width="1.5"/><path d="M136.0 376l7 7-7 7m13 0h13" fill="none" stroke="#275f85" stroke-width="2"/><text x="164.0" y="405" font-size="15" fill="#275f85" font-weight="600" text-anchor="middle">Linux</text><rect x="262.0" y="305" width="104" height="34" rx="5" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/><text x="314.0" y="328" font-size="17" fill="#275f85" font-weight="600" text-anchor="middle">Controller</text><path d="M314.0 339v23" fill="none" stroke="#275f85" stroke-width="2"/><rect x="268.0" y="362" width="92" height="52" rx="5" fill="#ffffff" stroke="#275f85" stroke-width="1.5"/><path d="M286.0 376l7 7-7 7m13 0h13" fill="none" stroke="#275f85" stroke-width="2"/><text x="314.0" y="405" font-size="15" fill="#275f85" font-weight="600" text-anchor="middle">Linux</text><text x="239.0" y="437" font-size="17" fill="#53616a" font-weight="400" text-anchor="middle">Stored state survives a stop</text><rect x="468" y="142" width="426" height="312" rx="8" fill="#efede6" stroke="#a8b2b6" stroke-width="1.5"/><text x="486" y="172" font-size="20" fill="#263238" font-weight="600" text-anchor="start">Customer B</text><rect x="577.0" y="200" width="208" height="67" rx="5" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/><text x="601.0" y="225" font-size="17" fill="#275f85" font-weight="600" text-anchor="start">Account coordinator</text><path d="M589.0 238v17c0 8 26 8 26 0V238" fill="#cce0e9" stroke="#275f85" stroke-width="1.5"/><ellipse cx="602.0" cy="238" rx="13" ry="4" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/><text x="623.0" y="256" font-size="15" fill="#275f85" font-weight="400" text-anchor="start">Shared usage</text><path d="M681.0 267v21M606.0 288h150M606.0 288v17M756.0 288v