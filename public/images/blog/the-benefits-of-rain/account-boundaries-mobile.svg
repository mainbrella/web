<svg xmlns="http://www.w3.org/2000/svg" width="440" height="700" viewBox="0 0 440 700" role="img" aria-labelledby="title desc"><title id="title">An account budget survives a stopped machine</title><desc id="desc">The API routes to one account coordinator and two workspace controllers. One Linux machine is stopped. Persistent state remains above the disposable Linux compute.</desc><rect width="440" height="700" fill="#f7f4ec"/><g font-family="Helvetica,Arial,sans-serif"><text x="20" y="31" font-size="21" fill="#263238" font-weight="600" text-anchor="start">One customer’s shared budget</text><rect x="105" y="54" width="230" height="47" rx="5" fill="#ffffff" stroke="#275f85" stroke-width="1.5"/><text x="220" y="84" font-size="20" fill="#275f85" font-weight="600" text-anchor="middle">API Worker</text><text x="220" y="126" font-size="15" fill="#53616a" font-weight="400" text-anchor="middle">Sessions + keys · D1 account data</text><rect x="20" y="158" width="400" height="312" rx="8" fill="#efede6" stroke="#a8b2b6" stroke-width="1.5"/><text x="38" y="188" font-size="20" fill="#263238" font-weight="600" text-anchor="start">Customer account</text><rect x="116.0" y="216" width="208" height="67" rx="5" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/><text x="140.0" y="241" font-size="17" fill="#275f85" font-weight="600" text-anchor="start">Account coordinator</text><path d="M128.0 254v17c0 8 26 8 26 0V254" fill="#cce0e9" stroke="#275f85" stroke-width="1.5"/><ellipse cx="141.0" cy="254" rx="13" ry="4" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/><text x="162.0" y="272" font-size="15" fill="#275f85" font-weight="400" text-anchor="start">Shared usage</text><path d="M220.0 283v21M145.0 304h150M145.0 304v17M295.0 304v17" fill="none" stroke="#275f85" stroke-width="2"/><rect x="93.0" y="321" width="104" height="34" rx="5" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/><text x="145.0" y="344" font-size="17" fill="#275f85" font-weight="600" text-anchor="middle">Controller</text><path d="M145.0 355v23" fill="none" stroke="#275f85" stroke-width="2"/><rect x="99.0" y="378" width="92" height="52" rx="5" fill="#ffffff" stroke="#275f85" stroke-width="1.5"/><path d="M117.0 392l7 7-7 7m13 0h13" fill="none" stroke="#275f85" stroke-width="2"/><text x="145.0" y="421" font-size="15" fill="#275f85" font-weight="600" text-anchor="middle">Linux</text><rect x="243.0" y="321" width="104" height="34" rx="5" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/><text x="295.0" y="344" font-size="17" fill="#275f85" font-weight="600" text-anchor="middle">Controller</text><path d="M295.0 355v23" fill="none" stroke="#92a0a7" stroke-width="2" stroke-dasharray="5 5"/><rect x="249.0" y="378" width="92" height="52" rx="5" fill="none" stroke="#92a0a7" stroke-width="1.5" stroke-dasharray="5 5"/><text x="295.0" y="409" font-size="15" fill="#53616a" font-weight="400" text-anchor="middle">Stopped</text><text x="220.0" y="453" font-size="17" fill="#53616a" font-weight="400" text-anchor="middle">Stored state survives a stop</text><path d="M220 140V216" fill="none" stroke="#275f85" stroke-width="2"/><text x="24" y="508" font-size="20" fill="#263238" font-weight="600" text-anchor="start">Stop the Linux machine.</text><text x="24" y="538" font-size="18" fill="#53616a" font-weight="400" text-anchor="start">Its controller and the account’s</text><text x="24" y="565" font-size="18" fill="#53616a" font-weight="400" text-anchor="start">usage records remain in storage.</text><path d="M36 593v17c0 8 26 8 26 0V593" fill="#cce0e9" stroke="#275f85" stroke-width="1.5"/><ellipse cx="49" cy="593" rx="13" ry="4" fill="#e4eff4" stroke="#275f85" stroke-width="1.5"/><text x="78" y="613" font-size="16" fill="#275f85" font-weight="400" text-anchor="start">Persistent state</text><rect x="28" y="638" width="40" height="30" rx="5" fill="none" stroke="#92a0a7" stroke-width="1.5" stroke-dasharray="5 5"/><text x="78" y="660" font-size="16" fill="#53616a" font-weight="400" text-anchor="start">Stopped compute</text></g></svg>