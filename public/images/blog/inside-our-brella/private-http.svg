<svg xmlns="http://www.w3.org/2000/svg" width="560" height="800" viewBox="0 0 560 800" role="img" aria-labelledby="title desc">
  <title id="title">Private HTTP uses platform identity and generation checks</title>
  <desc id="desc">A guest request to api.internal passes an outbound relay that supplies trusted identity, then a network-scoped account registry, then the exact destination runtime and application port. Response release rechecks current lifecycle and membership.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#80aaff" stroke-width="1.5"/></marker></defs>
  <g font-family="Helvetica, Arial, sans-serif" fill="#f2f4f7">
    <g fill="#141920" stroke="#536274" stroke-width="1.5">
      <rect x="16" y="16" width="528" height="100" rx="4"/>
      <rect x="16" y="160" width="528" height="126" rx="4"/>
      <rect x="16" y="330" width="528" height="126" rx="4"/>
      <rect x="16" y="500" width="528" height="126" rx="4"/>
    </g>
    <g font-size="28" font-weight="600">
      <text x="40" y="57">Caller guest</text>
      <text x="40" y="201">Outbound relay</text>
      <text x="40" y="371">Account registry</text>
      <text x="40" y="541">Destination runtime</text>
    </g>
    <g font-size="24">
      <text x="40" y="93" fill="#80aaff">http://api.internal/users</text>
      <g fill="#a4adb8">
        <text x="40" y="238">Strip guest identity headers</text>
        <text x="40" y="272">Supply source from platform props</text>
        <text x="40" y="408">Find source’s network and api</text>
        <text x="40" y="442">Select destination generation + port</text>
        <text x="40" y="578">Check generation and registration</text>
        <text x="40" y="612">Forward to guest port 8080</text>
      </g>
      <text x="16" y="682" font-weight="600">Before releasing the response</text>
      <g fill="#a4adb8">
        <text x="16" y="719">Destination: generation + registration</text>
        <text x="16" y="752">Account: source live + membership</text>
        <text x="16" y="785">Application effects are not rolled back.</text>
      </g>
    </g>
    <g fill="none" stroke="#80aaff" stroke-width="2" marker-end="url(#arrow)">
      <path d="M280 116V148"/><path d="M280 286V318"/><path d="M280 456V488"/>
    </g>
  </g>
</svg>
