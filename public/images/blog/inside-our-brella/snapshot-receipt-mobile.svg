<svg xmlns="http://www.w3.org/2000/svg" width="440" height="740" viewBox="0 0 440 740" role="img" aria-labelledby="title desc">
<title id="title">A saved handle separates recovery from uncertainty</title><desc id="desc">A retry recovers a saved provider handle. If only capture intent remains, the operation stays unresolved and capture is not repeated.</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#242d35"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315f82"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a23832"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58636d"/></marker>
</defs>
<rect width="440" height="740" fill="#f5f3ed"/>
<text x="24" y="35" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start">A saved disk needs an address</text>
<text x="220" y="91" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Attempt to capture the disk</text>
<path d="M220 110 V148" fill="none" stroke="#242d35" stroke-width="2"/>
<path d="M220 148 H112 V164" fill="none" stroke="#242d35" stroke-width="2" marker-end="url(#ink)"/>
<path d="M220 148 H325 V164" fill="none" stroke="#242d35" stroke-width="2" marker-end="url(#ink)"/>
<text x="111" y="186" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Address saved</text>
<text x="325" y="186" fill="#a23832" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Address missing</text>
<path d="M112 201 V222" fill="none" stroke="#242d35" stroke-width="2" marker-end="url(#ink)"/>
<path d="M325 201 V222" fill="none" stroke="#242d35" stroke-width="2" marker-end="url(#ink)"/>
<path d="M37 231 H167 l20 20 V363 H37 Z" fill="#fffefd" stroke="#58636d" stroke-width="2"/>
<path d="M167 231 v20 h20" fill="none" stroke="#58636d" stroke-width="2"/>
<text x="53" y="270" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">save: a7…</text>
<text x="53" y="307" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">address:</text>
<text x="53" y="340" fill="#315f82" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">snap: b9…</text>
<path d="M250 231 H380 l20 20 V363 H250 Z" fill="#fffefd" stroke="#58636d" stroke-width="2"/>
<path d="M380 231 v20 h20" fill="none" stroke="#58636d" stroke-width="2"/>
<text x="266" y="270" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">save: a7…</text>
<text x="266" y="307" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">address:</text>
<path d="M266 336 h118" fill="none" stroke="#58636d" stroke-width="2" stroke-dasharray="7 6"/>
<text x="220" y="401" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">What the runtime saved</text>
<path d="M112 418 V464" fill="none" stroke="#315f82" stroke-width="2" marker-end="url(#blue)"/>
<path d="M325 418 V464" fill="none" stroke="#242d35" stroke-width="2" marker-end="url(#ink)"/>
<text x="112" y="497" fill="#315f82" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Read address</text>
<text x="112" y="526" fill="#315f82" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Finish the save</text>
<text x="325" y="497" fill="#a23832" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle">503</text>
<text x="325" y="526" fill="#a23832" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Unresolved</text>
<path d="M325 551 H426 V91 H362" fill="none" stroke="#a23832" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#red)"/>
<path d="M419 198 L433 212 M419 212 L433 198" fill="none" stroke="#a23832" stroke-width="3"/>
<text x="325" y="580" fill="#a23832" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">No recapture</text>
<rect x="103" y="613" width="18" height="18" rx="0" fill="#27624e" stroke="none" stroke-width="2"/>
<path d="M317 610 l21 12 l-21 12 Z" fill="#27624e"/>
<text x="112" y="662" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Stop allowed</text>
<text x="325" y="657" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Save leaves</text>
<text x="325" y="685" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">source intact</text>
<text x="24" y="721" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Both branches start with a saved intent.</text>
</svg>
