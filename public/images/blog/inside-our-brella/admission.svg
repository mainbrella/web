<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
<title id="title">Sequential reservations, overlapping boots</title><desc id="desc">The account saves each reservation in sequence, then independent runtimes boot concurrently. Time is schematic.</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#242d35"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315f82"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a23832"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58636d"/></marker>
</defs>
<rect width="920" height="420" fill="#f5f3ed"/>
<text x="32" y="38" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="start">Reserve in order; boot in parallel</text>
<path d="M248 68 H867" fill="none" stroke="#58636d" stroke-width="2" marker-end="url(#muted)"/>
<text x="867" y="53" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end">Schematic time</text>
<text x="32" y="139" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Account lock</text>
<rect x="267" y="109" width="36" height="36" rx="2" fill="#242d35" stroke="none" stroke-width="2"/>
<text x="285" y="135" fill="#f5f3ed" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">1</text>
<rect x="367" y="109" width="36" height="36" rx="2" fill="#242d35" stroke="none" stroke-width="2"/>
<text x="385" y="135" fill="#f5f3ed" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">2</text>
<rect x="467" y="109" width="36" height="36" rx="2" fill="#242d35" stroke="none" stroke-width="2"/>
<text x="485" y="135" fill="#f5f3ed" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">3</text>
<text x="32" y="218" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">c17</text>
<rect x="310" y="191" width="420" height="40" rx="2" fill="#dce6ed" stroke="#315f82" stroke-width="2"/>
<text x="520.0" y="218" fill="#315f82" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">boot + readiness</text>
<path d="M746 211 l5 5 l10 -12" fill="none" stroke="#27624e" stroke-width="3"/>
<text x="772" y="218" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">ready</text>
<text x="32" y="288" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">c18</text>
<rect x="410" y="261" width="390" height="40" rx="2" fill="#dce6ed" stroke="#315f82" stroke-width="2"/>
<text x="605.0" y="288" fill="#315f82" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">boot + readiness</text>
<path d="M816 281 l5 5 l10 -12" fill="none" stroke="#27624e" stroke-width="3"/>
<text x="842" y="288" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">ready</text>
<text x="32" y="358" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">c19</text>
<rect x="510" y="331" width="245" height="40" rx="2" fill="#dce6ed" stroke="#315f82" stroke-width="2"/>
<text x="632.5" y="358" fill="#315f82" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">boot + readiness</text>
<path d="M771 351 l5 5 l10 -12" fill="none" stroke="#27624e" stroke-width="3"/>
<text x="797" y="358" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">ready</text>
<text x="32" y="402" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">■ = saved reservation. Each machine waits for its own decision.</text>
</svg>
