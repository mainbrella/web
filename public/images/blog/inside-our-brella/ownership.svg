<svg xmlns="http://www.w3.org/2000/svg" width="560" height="690" viewBox="0 0 560 690" role="img" aria-labelledby="title desc">
  <title id="title">Who owns each decision in Mainbrella</title>
  <desc id="desc">Creation flows from the public API, through the account coordinator and a per-slot runtime, to a Linux guest. Each layer owns different facts.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#80aaff" stroke-width="1.5"/></marker></defs>
  <g font-family="Helvetica, Arial, sans-serif" fill="#f2f4f7">
    <g fill="#141920" stroke="#536274" stroke-width="1.5">
      <rect x="16" y="16" width="528" height="124" rx="4"/>
      <rect x="16" y="188" width="528" height="136" rx="4"/>
      <rect x="16" y="372" width="528" height="136" rx="4"/>
      <rect x="16" y="556" width="528" height="118" rx="4"/>
    </g>
    <g font-size="28" font-weight="600">
      <text x="40" y="57">Public API Worker</text>
      <text x="40" y="229">ContainerAccount</text>
      <text x="40" y="413">UserContainer</text>
      <text x="40" y="597">Linux guest</text>
    </g>
    <g font-size="24" fill="#a4adb8">
      <text x="40" y="94">Caller · billing · image selection</text>
      <text x="40" y="266">Slots · budgets · operation receipts</text>
      <text x="40" y="301">One logical owner per account</text>
      <text x="40" y="450">Generation · deadlines · launch checks</text>
      <text x="40" y="485">One logical owner per slot</text>
      <text x="40" y="637">Processes · files · application state</text>
    </g>
    <g fill="none" stroke="#80aaff" stroke-width="2" marker-end="url(#arrow)">
      <path d="M280 140V176"/><path d="M280 324V360"/><path d="M280 508V544"/>
    </g>
  </g>
</svg>
