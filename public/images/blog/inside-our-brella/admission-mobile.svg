<rect x="52" y="252" width="36" height="36" rx="2" fill="#242d35" stroke="none" stroke-width="2"/>
<text x="70" y="277" fill="#f5f3ed" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">2</text>
<path d="M87 365 H372" fill="none" stroke="#315f82" stroke-width="2" marker-end="url(#blue)"/>
<rect x="52" y="347" width="36" height="36" rx="2" fill="#242d35" stroke="none" stroke-width="2"/>
<text x="70" y="372" fill="#f5f3ed" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">3</text>
