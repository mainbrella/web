<text x="182" y="497" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">ready</text>
<rect x="254" y="278" width="46" height="252" rx="2" fill="#dce6ed" stroke="#315f82" stroke-width="2"/>
<text x="283" y="400.0" fill="#315f82" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" transform="rotate(-90 283 400.0)">boot</text>
<path d="M270 546 l5 5 l10 -12" fill="none" stroke="#27624e" stroke-width="3"/>
<text x="277" y="577" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">ready</text>
