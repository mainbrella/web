<text x="372" y="542" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">ready</text>
<text x="24" y="610" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">■ = reservation committed to storage</text>
