<svg xmlns="http://www.w3.org/2000/svg" width="440" height="640" viewBox="0 0 440 640" role="img" aria-labelledby="title desc">
<title id="title">Sequential reservations, overlapping boots</title><desc id="desc">The account saves each reservation in sequence, then independent runtimes boot concurrently. Time is schematic.</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#242d35"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315f82"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a23832"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58636d"/></marker>
</defs>
<rect width="440" height="640" fill="#f5f3ed"/>
<text x="24" y="35" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start">Reserve in order; boot in parallel</text>
<text x="24" y="63" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Schematic time ↓</text>
<text x="70" y="106" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Account</text>
<text x="182" y="106" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">c17</text>
<text x="277" y="106" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">c18</text>
<text x="372" y="106" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">c19</text>
<path d="M70 125 V570" fill="none" stroke="#58636d" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#muted)"/>
<path d="M87 175 H182" fill="none" stroke="#315f82" stroke-width="2" marker-end="url(#blue)"/>
