<svg xmlns="http://www.w3.org/2000/svg" width="440" height="690" viewBox="0 0 440 690" role="img" aria-labelledby="title desc">
<title id="title">A delayed boot reaches a reused slot</title><desc id="desc">Cancel 41 precedes boot 42. Delayed boot 41 is rejected and late cancel 41 leaves the replacement running. Time runs down.</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#242d35"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315f82"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a23832"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58636d"/></marker>
</defs>
<rect width="440" height="690" fill="#f5f3ed"/>
<text x="24" y="36" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start">Boot 41 arrives after boot 42</text>
<text x="24" y="65" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Schematic time ↓</text>
<text x="64" y="107" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Account</text>
<text x="303" y="107" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">c17 runtime</text>
<path d="M64 126 V643" fill="none" stroke="#58636d" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M303 126 V643" fill="none" stroke="#58636d" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="295" y="330" width="16" height="305" rx="0" fill="#cce2d6" stroke="none" stroke-width="2"/>
<path d="M64 145 C190 145 181 465 303 465" fill="none" stroke="#a23832" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#red)"/>
<text x="154" y="140" fill="#a23832" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">boot 41</text>
<text x="154" y="164" fill="#a23832" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">delayed</text>
<path d="M64 220 H303" fill="none" stroke="#242d35" stroke-width="2" marker-end="url(#ink)"/>
<text x="235" y="207" fill="#242d35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">cancel 41</text>
<path d="M64 330 H303" fill="none" stroke="#315f82" stroke-width="2" marker-end="url(#blue)"/>
<text x="235" y="317" fill="#315f82" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">boot 42</text>
<path d="M64 570 H303" fill="none" stroke="#58636d" stroke-width="2" marker-end="url(#muted)"/>
<text x="235" y="557" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">cancel 41</text>
<text x="325" y="244" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">fenced</text>
<text x="325" y="268" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">≤ 41</text>
<text x="325" y="354" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">accept</text>
<text x="325" y="378" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">42</text>
<path d="M295 457 L311 473 M295 473 L311 457" fill="none" stroke="#a23832" stroke-width="3"/>
<text x="325" y="459" fill="#a23832" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">reject</text>
<text x="325" y="483" fill="#a23832" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">41</text>
<text x="325" y="596" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">ignore</text>
<text x="325" y="620" fill="#58636d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">41</text>
<text x="24" y="671" fill="#27624e" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Replacement 42 remains running.</text>
</svg>
