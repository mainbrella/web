<svg xmlns="http://www.w3.org/2000/svg" width="560" height="760" viewBox="0 0 560 760" role="img" aria-labelledby="title desc">
  <title id="title">Snapshot capture intent and handle commits precede stop</title>
  <desc id="desc">Save persists account intent and quota, runtime capture intent, then calls the provider. Runtime saves the returned handle and account commits it before optional stop. An ambiguous provider outcome without a saved handle refuses recapture.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#80aaff" stroke-width="1.5"/></marker></defs>
  <g font-family="Helvetica, Arial, sans-serif" fill="#f2f4f7">
    <g fill="#141920" stroke="#536274" stroke-width="1.5">
      <rect x="16" y="16" width="528" height="80" rx="4"/>
      <rect x="16" y="132" width="528" height="80" rx="4"/>
      <rect x="16" y="248" width="528" height="80" rx="4"/>
      <rect x="16" y="364" width="528" height="80" rx="4"/>
      <rect x="16" y="480" width="528" height="80" rx="4"/>
    </g>
    <g font-size="26" font-weight="600">
      <text x="40" y="49">Account persists save intent</text>
      <text x="40" y="165">Runtime persists capture intent</text>
      <text x="40" y="281">Call provider snapshot</text>
      <text x="40" y="397">Runtime saves returned handle</text>
      <text x="40" y="513">Account commits handle</text>
    </g>
    <g font-size="24" fill="#a4adb8">
      <text x="40" y="80">Reserve capacity + capture budget</text>
      <text x="40" y="196">Receipt exists before provider call</text>
      <text x="40" y="312">Success path needs a handle</text>
      <text x="40" y="428">Retry can recover a lost reply</text>
      <text x="40" y="544">Snapshot is durable before teardown</text>
      <text x="16" y="710">No saved handle + uncertain outcome:</text>
      <text x="16" y="746">refuse recapture; do not enter stop.</text>
    </g>
    <text x="16" y="642" font-size="28" font-weight="600">Then: optional stop of source</text>
    <g fill="none" stroke="#80aaff" stroke-width="2" marker-end="url(#arrow)">
      <path d="M280 96V120"/><path d="M280 212V236"/>
      <path d="M280 328V352"/><path d="M280 444V468"/><path d="M280 560V602"/>
    </g>
  </g>
</svg>
