<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="title desc"><title id="title">Access expires before the machine</title><desc id="desc">A hypothetical timeline. The original machine and its disk outlive the preview endpoint. Renewal could reconnect to that generation. A replacement machine starts with a separate disk. Renewal is proposed, not implemented.</desc><rect width="920" height="380" fill="#f7f4ec"/><g font-family="Helvetica,Arial,sans-serif"><text x="28" y="38" font-size="25" fill="#263238" font-weight="600">The address expires. The work is still there.</text><text x="240" y="87" font-size="20" fill="#263238" font-weight="400">Start</text><text x="528" y="87" font-size="18" fill="#9b3933" font-weight="600">Preview expires</text><text x="766" y="87" font-size="18" fill="#263238" font-weight="400">Hard lease ends</text><path d="M560 98V340" stroke="#9b3933" stroke-width="2" stroke-dasharray="5 5"/><text x="28" y="141" font-size="21" fill="#263238" font-weight="600">Machine A</text><rect x="240" y="115" width="600" height="38" rx="4" fill="#275f85"/><text x="257" y="141" font-size="19" fill="#ffffff" font-weight="400">Same generation · same disk</text><text x="28" y="212" font-size="21" fill="#263238" font-weight="400">Preview access</text><rect x="240" y="186" width="320" height="38" rx="4" fill="#2a6948"/><text x="257" y="212" font-size="19" fill="#ffffff" font-weight="400">Usable endpoint</text><path d="M571 204H832" stroke="#2a6948" stroke-width="3" stroke-dasharray="7 6"/><text x="588" y="189" font-size="18" fill="#2a6948" font-weight="400">Renewal would go here</text><text x="588" y="232" font-size="17" fill="#53616a" font-weight="400">Not implemented</text><text x="28" y="287" font-size="21" fill="#263238" font-weight="400">Replacement B</text><rect x="595" y="261" width="245" height="38" rx="4" fill="#ece0da"/><text x="610" y="287" font-size="19" fill="#9b3933" font-weight="600">Separate disk</text><text x="240" y="345" font-size="17" fill="#53616a" font-weight="400">Time →    Schematic: the machine lease is longer than the preview.</text></g></svg>