<svg xmlns="http://www.w3.org/2000/svg" width="440" height="540" viewBox="0 0 440 540" role="img" aria-labelledby="title desc"><title id="title">Access expires before the machine</title><desc id="desc">A hypothetical timeline. The original machine and its disk outlive the preview endpoint. Renewal could reconnect to that generation. A replacement machine starts with a separate disk. Renewal is proposed, not implemented.</desc><rect width="440" height="540" fill="#f7f4ec"/><g font-family="Helvetica,Arial,sans-serif"><text x="22" y="34" font-size="25" fill="#263238" font-weight="600">Access expires first</text><text x="22" y="65" font-size="19" fill="#53616a" font-weight="400">Same work, unreachable address</text><text x="122" y="113" font-size="17" fill="#263238" font-weight="400">Start</text><text x="235" y="113" font-size="17" fill="#9b3933" font-weight="600">Preview</text><text x="235" y="134" font-size="17" fill="#9b3933" font-weight="600">expires</text><path d="M258 144V437" stroke="#9b3933" stroke-width="2" stroke-dasharray="5 5"/><text x="22" y="179" font-size="23" fill="#263238" font-weight="600">A</text><rect x="122" y="151" width="290" height="42" rx="4" fill="#275f85"/><text x="135" y="178" font-size="18" fill="#ffffff" font-weight="400">Same machine and disk</text><text x="22" y="242" font-size="19" fill="#263238" font-weight="400">Access</text><rect x="122" y="215" width="136" height="40" rx="4" fill="#2a6948"/><text x="133" y="241" font-size="18" fill="#ffffff" font-weight="400">Endpoint</text><path d="M270 235H412" stroke="#2a6948" stroke-width="3" stroke-dasharray="7 6"/><text x="270" y="281" font-size="18" fill="#2a6948" font-weight="600">Renewal</text><text x="270" y="305" font-size="17" fill="#2a6948" font-weight="400">proposed</text><text x="22" y="363" font-size="23" fill="#263238" font-weight="600">B</text><rect x="270" y="335" width="142" height="42" rx="4" fill="#ece0da"/><text x="279" y="362" font-size="17" fill="#9b3933" font-weight="600">Separate disk</text><text x="122" y="416" font-size="18" fill="#53616a" font-weight="400">Time →</text><text x="22" y="465" font-size="17" fill="#53616a" font-weight="400">Schematic: A stays alive until its hard lease.</text><text x="22" y="491" font-size="17" fill="#53616a" font-weight="400">Renewal would reconnect to A.</text><text x="22" y="517" font-size="17" fill="#53616a" font-weight="400">Starting B would not recover A’s files.</text></g></svg>