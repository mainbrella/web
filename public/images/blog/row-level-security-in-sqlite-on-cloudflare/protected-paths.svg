<svg xmlns="http://www.w3.org/2000/svg" width="800" height="376" viewBox="0 0 800 376" role="img" aria-labelledby="title desc">
  <title id="title">Both app access paths use the same guard</title>
  <desc id="desc">A browser table request and an isolated customer JavaScript database call converge at the trusted Worker. It checks the key, session, and policy, then sends parameterized SQL to project D1. A dashed direct path from customer code is blocked: it receives no D1 binding or account credentials.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#34654e" stroke-width="1.5"/></marker>
    <marker id="stop-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#9b4535" stroke-width="1.5"/></marker>
  </defs>
  <rect width="800" height="376" rx="4" fill="#f5f3eb"/>
  <g font-family="system-ui, sans-serif" fill="#25362e">
    <text x="28" y="36" font-size="17" font-weight="600">App callers</text>
    <rect x="290" y="20" width="482" height="264" rx="6" fill="#e5ebe1"/>
    <text x="310" y="50" font-size="17" font-weight="600">Platform-controlled access</text>
    <rect x="28" y="62" width="184" height="70" rx="4" fill="#fffdf7" stroke="#526458"/>
    <text x="46" y="91" font-size="18" font-weight="600">Browser</text>
    <text x="46" y="116" font-size="16">Table request</text>
    <rect x="28" y="188" width="184" height="86" rx="4" fill="#fffdf7" stroke="#526458" stroke-dasharray="5 4"/>
    <text x="46" y="215" font-size="18" font-weight="600">Customer JS</text>
    <text x="46" y="239" font-size="16">Isolated Worker</text>
    <text x="46" y="261" font-size="15" font-family="ui-monospace, monospace">ctx.db.update()</text>
    <path d="M212 98 H250 V172 H310 M212 232 H250 V172" stroke="#34654e" stroke-width="2.5" fill="none"/>
    <circle cx="250" cy="172" r="4" fill="#34654e"/>
    <path d="M272 172 H310" stroke="#34654e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="318" y="90" width="204" height="166" rx="4" fill="#fffdf7" stroke="#34654e" stroke-width="2"/>
    <text x="336" y="120" font-size="19" font-weight="600">Trusted Worker</text>
    <text x="336" y="151" font-size="16">Key grant</text>
    <text x="336" y="177" font-size="16">Verified session</text>
    <text x="336" y="203" font-size="16">Table policy</text>
    <path d="M336 219 H504" stroke="#c0cbbd"/>
    <text x="336" y="242" font-size="15">Credentials stay here</text>
    <path d="M522 172 H599" stroke="#34654e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="561" y="125" text-anchor="middle" font-size="15">SQL +</text>
    <text x="561" y="146" text-anchor="middle" font-size="15">params</text>
    <path d="M609 126 V216 C609 238 751 238 751 216 V126" fill="#fffdf7" stroke="#526458" stroke-width="1.5"/>
    <ellipse cx="680" cy="126" rx="71" ry="16" fill="#fffdf7" stroke="#526458" stroke-width="1.5"/>
    <text x="680" y="177" text-anchor="middle" font-size="20" font-weight="600">Project D1</text>
    <text x="680" y="202" text-anchor="middle" font-size="16">SQLite</text>
    <path d="M120 274 V318 H420" stroke="#9b4535" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#stop-arrow)"/>
    <path d="M440 308 460 328 M460 308 440 328" stroke="#9b4535" stroke-width="3"/>
    <text x="478" y="324" font-size="17" fill="#813c30">No direct D1 access</text>
    <text x="120" y="354" font-size="15" fill="#813c30">No database binding or account credentials in customer code</text>
  </g>
</svg>
