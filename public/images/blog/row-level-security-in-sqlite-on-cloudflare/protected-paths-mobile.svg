<svg xmlns="http://www.w3.org/2000/svg" width="350" height="602" viewBox="0 0 350 602" role="img" aria-labelledby="title desc">
  <title id="title">Both app access paths use the same guard</title>
  <desc id="desc">Browser and isolated customer JavaScript calls join at the trusted Worker, which checks key grants, session, and policy before sending SQL and parameters to D1. Customer JavaScript has no direct D1 access.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#34654e" stroke-width="1.5"/></marker></defs>
  <rect width="350" height="602" rx="4" fill="#f5f3eb"/>
  <g font-family="system-ui, sans-serif" fill="#25362e">
    <text x="20" y="32" font-size="17" font-weight="600">App callers</text>
    <rect x="20" y="50" width="138" height="82" rx="4" fill="#fffdf7" stroke="#526458"/>
    <text x="32" y="82" font-size="18" font-weight="600">Browser</text>
    <text x="32" y="110" font-size="15">Table request</text>
    <rect x="180" y="50" width="150" height="82" rx="4" fill="#fffdf7" stroke="#526458" stroke-dasharray="5 4"/>
    <text x="192" y="78" font-size="18" font-weight="600">Customer JS</text>
    <text x="192" y="101" font-size="15">Isolated Worker</text>
    <text x="192" y="121" font-size="14" font-family="ui-monospace, monospace">ctx.db</text>
    <path d="M89 132 V165 H255 V132" stroke="#34654e" stroke-width="2.5" fill="none"/>
    <circle cx="175" cy="165" r="4" fill="#34654e"/>
    <rect x="20" y="194" width="310" height="316" rx="6" fill="#e5ebe1"/>
    <text x="36" y="218" font-size="15" font-weight="600">Trusted platform</text>
    <path d="M175 165 V233" stroke="#34654e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="52" y="241" width="246" height="140" rx="4" fill="#fffdf7" stroke="#34654e" stroke-width="2"/>
    <text x="70" y="270" font-size="19" font-weight="600">Trusted Worker</text>
    <text x="70" y="297" font-size="16">Key grant · Session · Policy</text>
    <path d="M70 314 H280" stroke="#c0cbbd"/>
    <text x="70" y="341" font-size="16">Credentials stay here</text>
    <text x="70" y="365" font-size="15">Build SQL with bound values</text>
    <path d="M175 381 V427" stroke="#34654e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="190" y="409" font-size="15">SQL + params</text>
    <path d="M86 442 V481 C86 499 264 499 264 481 V442" fill="#fffdf7" stroke="#526458" stroke-width="1.5"/>
    <ellipse cx="175" cy="442" rx="89" ry="12" fill="#fffdf7" stroke="#526458" stroke-width="1.5"/>
    <text x="175" y="476" text-anchor="middle" font-size="19" font-weight="600">Project D1 / SQLite</text>
    <path d="M28 540 44 556 M44 540 28 556" stroke="#9b4535" stroke-width="3"/>
    <text x="58" y="554" font-size="17" fill="#813c30">No direct D1 access</text>
    <text x="28" y="583" font-size="15" fill="#813c30">No binding or credentials in customer JS</text>
  </g>
</svg>
