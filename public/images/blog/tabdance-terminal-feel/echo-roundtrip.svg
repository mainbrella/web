<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 0 880 570" role="img" aria-labelledby="title desc">
<title id="title">Terminal input and output cross thread boundaries</title><desc id="desc">Reconstructed from disassembly. Key input is encoded and queued on the main thread, written by the I/O thread in partial writes, echoed by the shell, read on the I/O thread, then decoded, parsed, and drawn on the main thread. Sequence is schematic.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52616a"/></marker>
  <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27659a"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f7f4ec"/>
<text x="30" y="35" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start">Terminal input and output cross threads</text><text x="30" y="59" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Reconstructed from disassembly · schematic sequence</text><text x="295.0" y="94" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Main thread</text><path d="M295.0 111L295.0 530" fill="none" stroke="#c4cbca" stroke-width="1" stroke-dasharray="4 5"/><text x="557.0" y="94" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">I/O thread</text><path d="M557.0 111L557.0 530" fill="none" stroke="#c4cbca" stroke-width="1" stroke-dasharray="4 5"/><text x="779.0" y="94" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">PTY + shell</text><path d="M779.0 111L779.0 530" fill="none" stroke="#c4cbca" stroke-width="1" stroke-dasharray="4 5"/><rect x="185" y="119" width="220" height="52" rx="3" fill="#f1e8d2" stroke="#8b641c" stroke-width="1.2"/><text x="295" y="141" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Encode key input</text><text x="295" y="161" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">queue PTY write</text><rect x="452" y="194" width="210" height="52" rx="3" fill="#e0ebe3" stroke="#356b56" stroke-width="1.2"/><text x="557" y="216" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Write queued bytes</text><text x="557" y="236" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">partial writes</text><rect x="701" y="269" width="156" height="54" rx="3" fill="#fffdf8" stroke="#66757a" stroke-width="1.2"/><text x="779" y="292" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Shell</text><text x="779" y="313" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">echo + output</text><rect x="452" y="344" width="210" height="52" rx="3" fill="#e0ebe3" stroke="#356b56" stroke-width="1.2"/><text x="557" y="366" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Read PTY output</text><text x="557" y="386" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">background I/O</text><rect x="185" y="419" width="220" height="52" rx="3" fill="#dce9f2" stroke="#27659a" stroke-width="1.2"/><text x="295" y="441" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Decode bytes</text><text x="295" y="461" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">VT100 parser</text><rect x="185" y="494" width="220" height="52" rx="3" fill="#dce9f2" stroke="#27659a" stroke-width="1.2"/><text x="295" y="516" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Mark rows dirty</text><text x="295" y="536" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">draw updated rows</text><path d="M405 145L446 216" fill="none" stroke="#52616a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M662 220L695 292" fill="none" stroke="#52616a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M701 310L668 368" fill="none" stroke="#52616a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M452 370L411 445" fill="none" stroke="#52616a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M295 471L295 487" fill="none" stroke="#52616a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>