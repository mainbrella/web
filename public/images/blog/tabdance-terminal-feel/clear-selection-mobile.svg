<svg xmlns="http://www.w3.org/2000/svg" width="390" height="684" viewBox="0 0 390 684" role="img" aria-labelledby="title desc">
<title id="title">Clearing output narrows the selection</title><desc id="desc">Stacked schematic terminal buffers compare selecting all while earlier output remains with selecting after Cmd+K clears it. The desired example includes the file contents and exactly two surrounding rows on each side.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52616a"/></marker>
  <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27659a"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f7f4ec"/>
