<svg xmlns="http://www.w3.org/2000/svg" width="390" height="615" viewBox="0 0 390 615" role="img" aria-labelledby="title desc">
<title id="title">Terminal input and output cross thread boundaries</title><desc id="desc">Reconstructed from disassembly. A vertical schematic shows encoded input queued on main, written by the I/O thread in partial writes, echoed by the shell, read on I/O, then decoded, parsed, and drawn on main.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52616a"/></marker>
  <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27659a"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f7f4ec"/>
<text x="22" y="34" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start">Terminal I/O crosses thread boundaries</text><text x="22" y="58" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Reconstructed from disassembly · schematic</text><text x="22" y="94" fill="#27659a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start">MAIN THREAD</text><rect x="22" y="105" width="346" height="54" rx="3" fill="#f1e8d2" stroke="#8b641c" stroke-width="1.2"/><text x="36" y="128" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="start">Encode key input</text><text x="36" y="149" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">queue PTY write</text><path d="M195 159L195 182" fill="none" stroke="#52616a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="22" y="205" fill="#356b56" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start">I/O THREAD</text><rect x="22" y="216" width="346" height="54" rx="3" fill="#e0ebe3" stroke="#356b56" stroke-width="1.2"/><text x="36" y="239" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="start">Write queued bytes</text><text x="36" y="259" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">partial writes</text><path d="M195 270L195 293" fill="none" stroke="#52616a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="22" y="316" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start">PTY + PROGRAM</text><rect x="22" y="327" width="346" height="50" rx="3" fill="#fffdf8" stroke="#66757a" stroke-width="1.2"/><text x="195" y="358" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Echo and program output</text><path d="M195 377L195 400" fill="none" stroke="#52616a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="22" y="423" fill="#356b56" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start">I/O THREAD</text><rect x="22" y="434" width="346" height="50" rx="3" fill="#e0ebe3" stroke="#356b56" stroke-width="1.2"/><text x="195" y="465" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Read PTY output</text><path d="M195 484L195 507" fill="none" stroke="#52616a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="22" y="530" fill="#27659a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start">MAIN THREAD</text><rect x="22" y="541" width="346" height="54" rx="3" fill="#dce9f2" stroke="#27659a" stroke-width="1.2"/><text x="36" y="564" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="start">Decode → VT100 parser</text><text x="36" y="584" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start">mark dirty rows; draw</text>
</svg>