600" text-anchor="start">2 · TUI erases and redraws</text><text x="22" y="234" fill="#27659a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="500" text-anchor="start">\r  ESC[2K</text><rect x="22" y="247" width="43" height="40" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="69" y="247" width="43" height="40" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="116" y="247" width="43" height="40" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="163" y="247" width="43" height="40" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="210" y="247" width="43" height="40" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><path d="M134 294L134 320" fill="none" stroke="#52616a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="22" y="346" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="start">3 · Live cells now blank</text><rect x="22" y="359" width="43" height="40" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="69" y="359" width="43" height="40" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="116" y="359" width="43" height="40" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="163" y="359" width="43" height="40" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="210" y="359" width="43" height="40" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><path d="M253 126L337 126" fill="none" stroke="#27659a" stroke-width="1.5"/><path d="M337 126L337 438" fill="none" stroke="#27659a" stroke-width="1.5"/><path d="M337 438L337 447" fill="none" stroke="#27659a" stroke-width="1.5" marker-end="url(#blue-arrow)"/><rect x="22" y="450" width="346" height="89" rx="3" fill="#dce9f2" stroke="#27659a" stroke-width="1.2"/><text x="38" y="476" fill="#27659a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">Saved when selected</text><text x="38" y="514" fill="#27659a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="500" text-anchor="start">hello</text><path d="M195 539L195 573" fill="none" stroke="#27659a" stroke-width="1.5" marker-end="url(#blue-arrow)"/><rect x="22" y="586" width="346" height="66" rx="3" fill="#fffdf8" stroke="#9da9aa" stroke-width="1"/><text x="195" y="612" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Clipboard</text><text x="195" y="640" fill="#27659a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500" text-anchor="middle">hello</text>
</svg>