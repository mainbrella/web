<svg xmlns="http://www.w3.org/2000/svg" width="390" height="675" viewBox="0 0 390 675" role="img" aria-labelledby="title desc">
<title id="title">A saved selection survives a terminal redraw</title><desc id="desc">A vertical schematic sequence shows selected hello cells erased by a redraw while the saved selection remains available to copy.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52616a"/></marker>
  <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27659a"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f7f4ec"/>
