<svg xmlns="http://www.w3.org/2000/svg" width="880" height="365" viewBox="0 0 880 365" role="img" aria-labelledby="title desc">
<title id="title">A saved selection survives a terminal redraw</title><desc id="desc">Five selected cells containing hello are erased by a carriage return and clear-line sequence. The selection snapshot remains available to the copy action even though the live cells are blank.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52616a"/></marker>
  <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27659a"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f7f4ec"/>
<text x="30" y="35" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start">The cells can change while the selection stays put</text><text x="30" y="58" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Schematic redraw sequence</text><text x="30" y="94" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Selected cells</text><text x="30" y="119" fill="#52616a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start">h e l l o</text><rect x="30" y="132" width="48" height="44" rx="2" fill="#dce9f2" stroke="#27659a" stroke-width="1.3"/><text x="54.0" y="159" fill="#27659a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" text-anchor="middle">h</text><rect x="84" y="132" width="48" height="44" rx="2" fill="#dce9f2" stroke="#27659a" stroke-width="1.3"/><text x="108.0" y="159" fill="#27659a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" text-anchor="middle">e</text><rect x="138" y="132" width="48" height="44" rx="2" fill="#dce9f2" stroke="#27659a" stroke-width="1.3"/><text x="162.0" y="159" fill="#27659a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" text-anchor="middle">l</text><rect x="192" y="132" width="48" height="44" rx="2" fill="#dce9f2" stroke="#27659a" stroke-width="1.3"/><text x="216.0" y="159" fill="#27659a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" text-anchor="middle">l</text><rect x="246" y="132" width="48" height="44" rx="2" fill="#dce9f2" stroke="#27659a" stroke-width="1.3"/><text x="270.0" y="159" fill="#27659a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" text-anchor="middle">o</text><text x="310" y="94" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">TUI erases and redraws</text><text x="310" y="119" fill="#27659a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="500" text-anchor="start">\r  ESC[2K</text><path d="M296 154L306 154" fill="none" stroke="#52616a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="310" y="132" width="48" height="44" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="364" y="132" width="48" height="44" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="418" y="132" width="48" height="44" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="472" y="132" width="48" height="44" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="526" y="132" width="48" height="44" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><path d="M578 154L586 154" fill="none" stroke="#52616a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="620" y="94" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">Live cells now blank</text><rect x="590" y="132" width="48" height="44" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="644" y="132" width="48" height="44" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="698" y="132" width="48" height="44" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="752" y="132" width="48" height="44" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><rect x="806" y="132" width="48" height="44" rx="2" fill="#fffdf8" stroke="#9da9aa" stroke-width="1.3"/><path d="M83 184L83 220" fill="none" stroke="#27659a" stroke-width="1.5" marker-end="url(#blue-arrow)"/><rect x="30" y="232" width="390" height="72" rx="3" fill="#dce9f2" stroke="#27659a" stroke-width="1.2"/><text x="46" y="258" fill="#27659a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="start">Saved when selected</text><text x="46" y="286" fill="#27659a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="500" text-anchor="start">hello</text><path d="M432 267L557 267" fill="none" stroke="#27659a" stroke-width="1.6" marker-end="url(#blue-arrow)"/><rect x="572" y="232" width="278" height="72" rx="3" fill="#fffdf8" stroke="#9da9aa" stroke-width="1"/><text x="711" y="260" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Clipboard</text><text x="711" y="286" fill="#27659a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="500" text-anchor="middle">hello</text><text x="30" y="340" fill="#52616a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Copy reads the saved selection; the visible row has already been cleared.</text>
</svg>