<svg xmlns="http://www.w3.org/2000/svg" width="440" height="640" viewBox="0 0 440 640" role="img" aria-labelledby="title desc"><title id="title">A slot is not a machine</title><desc id="desc">A hypothetical cleanup request for generation A is delayed. Slot small is reused for generation B. The request arrives and is rejected because its creation timestamp belongs to A. B continues running.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53616a"/></marker></defs><rect width="440" height="640" fill="#f7f4ec"/><g font-family="Helvetica,Arial,sans-serif"><text x="22" y="34" font-size="24" fill="#263238" font-weight="600" text-anchor="start">A slot is not a machine</text><text x="22" y="67" font-size="18" fill="#53616a" font-weight="400" text-anchor="start">Same name. Different creation time.</text><text x="69" y="108" font-size="19" fill="#263238" font-weight="600" text-anchor="middle">Old agent</text><text x="307" y="108" font-size="19" fill="#263238" font-weight="600" text-anchor="middle">Slot “small”</text><path d="M69 128L69 534" fill="none" stroke="#9ba7ac" stroke-width="2.5" stroke-dasharray="6 6"/><path d="M307 128L307 534" fill="none" stroke="#9ba7ac" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="225" y="130" width="164" height="94" rx="5" fill="#e4eff4" stroke="#275f85" stroke-width="2"/><text x="307.0" y="162" font-size="22" fill="#275f85" font-weight="600" text-anchor="middle">CSV job</text><text x="307.0" y="192" font-size="20" fill="#275f85" font-weight="400" text-anchor="middle">createdAt = A</text><text x="225" y="255" font-size="19" fill="#53616a" font-weight="400" text-anchor="start">A stops</text><text x="225" y="281" font-size="19" fill="#53616a" font-weight="400" text-anchor="start">Slot reused</text><rect x="225" y="310" width="164" height="174" rx="5" fill="#e4efe7" stroke="#2a6948" stroke-width="2"/><text x="307.0" y="342" font-size="22" fill="#2a6948" font-weight="600" text-anchor="middle">Next job</text><text x="307.0" y="372" font-size="20" fill="#2a6948" font-weight="400" text-anchor="middle">createdAt = B</text><text x="307" y="454" font-size="18" fill="#2a6948" font-weight="600" text-anchor="middle">Keeps running</text><circle cx="69" cy="153" r="6" fill="#9b3933"/><path d="M69 153L207 402" fill="none" stroke="#9b3933" stroke-width="2.5" stroke-dasharray="6 6"/><text x="22" y="332" font-size="19" fill="#9b3933" font-weight="600" text-anchor="start">Stop</text><text x="22" y="359" font-size="19" fill="#9b3933" font-weight="600" text-anchor="start">small@A</text><path d="M197 391L218 413" fill="none" stroke="#9b3933" stroke-width="2.5"/><path d="M218 391L197 413" fill="none" stroke="#9b3933" stroke-width="2.5"/><text x="22" y="554" font-size="23" fill="#9b3933" font-weight="600" text-anchor="start">Rejected: A ≠ B</text><text x="22" y="592" font-size="19" fill="#53616a" font-weight="400" text-anchor="start">The request names the old generation.</text><text x="22" y="619" font-size="19" fill="#53616a" font-weight="400" text-anchor="start">The replacement stays out of reach.</text></g></svg>