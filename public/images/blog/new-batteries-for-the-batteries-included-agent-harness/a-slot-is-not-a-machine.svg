<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">A slot is not a machine</title><desc id="desc">A hypothetical cleanup request for generation A is delayed. Slot small is reused for generation B. The request arrives and is rejected because its creation timestamp belongs to A. B continues running.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53616a"/></marker></defs><rect width="920" height="480" fill="#f7f4ec"/><g font-family="Helvetica,Arial,sans-serif"><text x="28" y="36" font-size="25" fill="#263238" font-weight="600" text-anchor="start">Same slot. Different machine.</text><text x="150" y="84" font-size="21" fill="#263238" font-weight="600" text-anchor="middle">Old agent</text><text x="727" y="84" font-size="21" fill="#263238" font-weight="600" text-anchor="middle">Slot “small”</text><path d="M150 105L150 420" fill="none" stroke="#9ba7ac" stroke-width="2.5" stroke-dasharray="6 6"/><path d="M727 105L727 420" fill="none" stroke="#9ba7ac" stroke-width="2.5" stroke-dasharray="6 6"/><path d="M35 105L35 415" fill="none" stroke="#53616a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="49" y="410" font-size="17" fill="#53616a" font-weight="400" text-anchor="start">Time</text><rect x="637" y="106" width="180" height="94" rx="5" fill="#e4eff4" stroke="#275f85" stroke-width="2"/><text x="727.0" y="138" font-size="22" fill="#275f85" font-weight="600" text-anchor="middle">CSV job</text><text x="727.0" y="168" font-size="20" fill="#275f85" font-weight="400" text-anchor="middle">createdAt = A</text><text x="839" y="158" font-size="18" fill="#275f85" font-weight="400" text-anchor="start">Runs</text><text x="637" y="227" font-size="18" fill="#53616a" font-weight="400" text-anchor="start">A stops; slot is reused</text><rect x="637" y="255" width="180" height="155" rx="5" fill="#e4efe7" stroke="#2a6948" stroke-width="2"/><text x="727.0" y="287" font-size="22" fill="#2a6948" font-weight="600" text-anchor="middle">Next job</text><text x="727.0" y="317" font-size="20" fill="#2a6948" font-weight="400" text-anchor="middle">createdAt = B</text><text x="727" y="383" font-size="19" fill="#2a6948" font-weight="600" text-anchor="middle">Keeps running</text><circle cx="150" cy="142" r="6" fill="#9b3933"/><path d="M150 142L608 345" fill="none" stroke="#9b3933" stroke-width="2.5" stroke-dasharray="6 6"/><text x="226" y="138" font-size="22" fill="#9b3933" font-weight="600" text-anchor="start">Stop small@A</text><text x="226" y="167" font-size="18" fill="#53616a" font-weight="400" text-anchor="start">Message is delayed</text><path d="M598 334L620 356" fill="none" stroke="#9b3933" stroke-width="2.5"/><path d="M620 334L598 356" fill="none" stroke="#9b3933" stroke-width="2.5"/><text x="307" y="372" font-size="21" fill="#9b3933" font-weight="600" text-anchor="start">Rejected: A ≠ B</text><text x="28" y="456" font-size="18" fill="#53616a" font-weight="400" text-anchor="start">A and B stand for two different creation timestamps.</text></g></svg>