name: Web and contract checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: web
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mainbrella/backend
          path: backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run docs:check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
