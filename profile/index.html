<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1014" />
    <meta name="description" content="Your Mainbrella profile." />
    <link rel="canonical" href="https://mainbrella.com/profile/" />
    <link rel="icon" href="/images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/mainbrella.css" />
    <link rel="stylesheet" href="/app.css" />
    <title>Profile · Mainbrella</title>
  </head>
  <body class="info-body sandbox-home app-body login-body">
    <a class="skip-link" href="#main">Skip to content</a>
    <!-- app-header -->
    <main id="main" class="login-main">
      <section class="login-content" aria-labelledby="login-title" aria-busy="true">
        <h1 id="login-title">Profile</h1>
        <p class="login-status" role="status">Checking your session…</p>
        <div class="login-error" role="alert" hidden></div>
        <div class="login-signed-in" hidden>
          <dl class="profile-details">
            <dt>Name</dt><dd class="login-identity"></dd>
            <dt>Email</dt><dd class="profile-email"></dd>
          </dl>
          <a class="text-link" href="/pricing/">Manage subscription</a>
          <button class="login-sign-out" type="button">Sign out</button>
        </div>
        <div class="login-cookie-notice" hidden>
          <button class="button" type="button" data-cookie-settings>Change cookie choice</button>
          <a class="text-link" href="/">Keep browsing</a>
        </div>
        <div class="login-provider" hidden>
          <div class="google-button-host" aria-label="Continue with Google"></div>
          <p class="google-loading" role="status" hidden>Loading Google sign-in…</p>
          <button class="google-retry" type="button" hidden>Retry Google sign-in</button>
        </div>
        <noscript><p>Enable JavaScript to sign in with Google.</p></noscript>
      </section>
    </main>
    <dialog class="cookie-consent" id="cookie-consent" aria-label="Cookie preferences" aria-describedby="cookie-consent-description">
      <p id="cookie-consent-description">This website uses cookies to measure and improve your experience. Read our <a href="/terms/" target="_blank" rel="noopener">Terms of Service<span class="visually-hidden"> (opens in a new tab)</span></a>.</p>
      <div class="cookie-consent-actions">
        <button class="button cookie-consent-reject" type="button" data-consent="rejected" autofocus>Reject All</button>
        <button class="button" type="button" data-consent="accepted">Accept All</button>
      </div>
    </dialog>
    <script type="module" src="/src/login.ts"></script>
    <script type="module" src="/src/account-menu.ts"></script>
  </body>
</html>
