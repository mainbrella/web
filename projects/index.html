<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1014" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://mainbrella.com/projects/" />
    <link rel="icon" href="/images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/mainbrella.css" />
    <link rel="stylesheet" href="/app.css" />
    <title>Projects · Mainbrella</title>
  </head>
  <body class="info-body sandbox-home app-body dashboard-body">
    <a class="skip-link" href="#main">Skip to content</a>
    <!-- app-header -->
    <main id="main" class="dashboard-main" aria-busy="true">
      <div class="dashboard-section-heading">
        <h1>Projects</h1>
        <button id="project-new" class="button button-small" type="button" disabled>New project</button>
      </div>
      <p id="projects-status" class="dashboard-status" role="status">Checking your session…</p>
      <p id="projects-error" class="dashboard-error" role="alert" hidden></p>
      <button id="projects-retry" class="dashboard-retry" type="button" hidden>Retry</button>
      <table class="project-table" aria-label="Projects">
        <thead><tr><th scope="col">Name</th><th scope="col">Domain</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
        <tbody id="project-list"></tbody>
      </table>
    </main>
    <dialog id="project-dialog" class="private-services-dialog" aria-labelledby="project-dialog-title">
      <h2 id="project-dialog-title">New project</h2>
      <form id="project-form">
        <label for="project-name">Name</label>
        <input id="project-name" type="text" maxlength="80" required autocomplete="off" />
        <label for="project-domain">Domain (optional)</label>
        <input id="project-domain" type="text" maxlength="253" placeholder="example.com" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" />
        <p id="project-error" class="dashboard-error" role="alert" hidden></p>
        <p id="project-status" class="dashboard-status" role="status"></p>
        <div class="container-actions">
          <button id="project-create" class="button button-small" type="submit">Create project</button>
          <button id="project-cancel" class="dashboard-retry" type="button">Cancel</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/account-menu.ts"></script>
    <script type="module" src="/src/projects.ts"></script>
  </body>
</html>
